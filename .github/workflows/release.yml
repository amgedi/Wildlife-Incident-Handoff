name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # Builds the desktop bundle + signed updater artifacts (createUpdaterArtifacts).
      - run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Package the canonical release set (manifest, checksums, web.zip).
      - run: node scripts/package-release.py
        continue-on-error: true
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, 'rc') }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/**/*.sig
            src-tauri/target/release/*.pico
            src-tauri/target/release/*.zip
            release/current/*.sha256
            release/current/manifest.json
          body: |
            See the repository README and KNOWN_LIMITATIONS.md. RC releases are tester builds.
