name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # Builds the desktop bundle + signed updater artifacts (createUpdaterArtifacts).
      - run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Companion launcher: Vite UI + Rust release build, attached to the release.
      - run: npm ci --prefix launcher/ui
      - run: npm run --prefix launcher/ui build
      - run: cargo build --release --manifest-path launcher/src-tauri/Cargo.toml
      # Canonical portable name for the bare desktop EXE.
      - name: Name portable artifact
        shell: pwsh
        run: Copy-Item "src-tauri/target/release/wildlife-incident-handoff.exe" "src-tauri/target/release/Wildlife-Incident-Handoff-Portable-${{ github.ref_name }}.exe"
      # SHA-256 checksums for every uploaded binary.
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe","src-tauri/target/release/wildlife-incident-handoff.exe","launcher/src-tauri/target/release/wih-launcher.exe" | ForEach-Object {
            $h = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Add-Content release-current-checksums.sha256
          }
          Get-Content release-current-checksums.sha256
      # Package the canonical release set (manifest, checksums, web.zip).
      - run: node scripts/package-release.py
        continue-on-error: true
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, 'rc') }}
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/Wildlife-Incident-Handoff-Portable-*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/*.zip
            launcher/src-tauri/target/release/wih-launcher.exe
            release-current-checksums.sha256
          body: |
            See the repository README and KNOWN_LIMITATIONS.md. RC releases are tester builds.
