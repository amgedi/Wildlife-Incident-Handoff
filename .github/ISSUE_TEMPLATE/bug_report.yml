name: Bug report
description: Something is broken or behaves unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Use fictional or redacted data only. Never post real sensitive wildlife coordinates, private contact details, credentials, or private case notes.
  - type: input
    id: version
    attributes:
      label: App version
      description: "Find it in Settings > About. Example: 0.3.0-rc.2"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: "Example: Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: scaling
    attributes:
      label: Display scaling
      description: "Example: 100%, 125%, or 150%. Useful for visual bugs."
  - type: dropdown
    id: workspace
    attributes:
      label: Where did it happen?
      options:
        - Reporting workflow
        - Dashboard / operations
        - Map
        - Incident workspace
        - Handoff
        - Export / backup
        - Settings
        - Launcher
        - LAN sync
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "Tell us what you did, in order."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: "Optional. Paste version and runtime diagnostics only. Remove anything private before submitting."
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: "Optional. Use fictional or redacted data only."
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked that this report does not contain real sensitive wildlife locations, private contact details, credentials, or private case notes.
          required: true
