[package]
name = "wih-launcher"
version = "0.3.0-rc.2"
description = "Wildlife Incident Handoff Launcher"
edition = "2021"

[[bin]]
name = "wih-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
lto = true
