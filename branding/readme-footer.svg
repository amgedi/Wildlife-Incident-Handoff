<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="210" viewBox="0 0 1400 210" role="img" aria-labelledby="title desc">
  <title id="title">Clear information. Safer handoffs.</title>
  <desc id="desc">Animated footer banner with a flowing wildlife incident handoff route.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b1510"/>
      <stop offset="48%" stop-color="#183126"/>
      <stop offset="100%" stop-color="#876b52"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#93ac80" stop-opacity=".12"/>
      <stop offset="35%" stop-color="#dce8d3" stop-opacity=".95"/>
      <stop offset="68%" stop-color="#a18463" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#a18463" stop-opacity=".08"/>
    </linearGradient>
    <radialGradient id="leftGlow">
      <stop offset="0%" stop-color="#83a873" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#83a873" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow">
      <stop offset="0%" stop-color="#b68f66" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#b68f66" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip">
      <rect width="1400" height="210" rx="30"/>
    </clipPath>
    <path id="footerRoute" d="M72 148 C255 92 395 163 560 129 C738 92 840 137 1010 103 C1140 77 1230 93 1328 61"/>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1400" height="210" fill="url(#bg)"/>

    <ellipse cx="120" cy="180" rx="300" ry="150" fill="url(#leftGlow)" filter="url(#blur)">
      <animate attributeName="cx" values="90;220;90" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1280" cy="20" rx="280" ry="145" fill="url(#rightGlow)" filter="url(#blur)">
      <animate attributeName="cx" values="1310;1190;1310" dur="16s" repeatCount="indefinite"/>
    </ellipse>

    <rect x="28" y="24" width="1344" height="162" rx="24" fill="#ffffff" fill-opacity=".025" stroke="#e8e3d8" stroke-opacity=".12"/>

    <g opacity=".15" fill="none">
      <path d="M-60 171 C240 117 420 202 700 151 C990 98 1160 170 1460 104" stroke="#d8e2d0" stroke-width="1.2">
        <animateTransform attributeName="transform" type="translate" values="-18 0;30 -4;-18 0" dur="18s" repeatCount="indefinite"/>
      </path>
      <path d="M-50 193 C250 151 475 209 750 181 C1030 151 1220 183 1450 149" stroke="#a18463" stroke-width="1.3">
        <animateTransform attributeName="transform" type="translate" values="20 0;-24 3;20 0" dur="21s" repeatCount="indefinite"/>
      </path>
    </g>

    <use href="#footerRoute" fill="none" stroke="#d8e2d0" stroke-opacity=".16" stroke-width="2"/>
    <use href="#footerRoute" fill="none" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="80 150">
      <animate attributeName="stroke-dashoffset" values="0;-460" dur="7s" repeatCount="indefinite"/>
    </use>

    <circle cx="72" cy="148" r="7" fill="#93ac80" filter="url(#glow)">
      <animate attributeName="r" values="6;8.5;6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1328" cy="61" r="7" fill="#a18463" filter="url(#glow)">
      <animate attributeName="r" values="6;9;6" dur="3.8s" repeatCount="indefinite"/>
    </circle>

    <circle r="5" fill="#f4f1e8" filter="url(#glow)">
      <animateMotion dur="6.3s" repeatCount="indefinite" rotate="auto">
        <mpath href="#footerRoute"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.92;1" dur="6.3s" repeatCount="indefinite"/>
    </circle>

    <g text-anchor="middle" transform="translate(700 72)">
      <text x="0" y="0" fill="#f4f1e8" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="750" letter-spacing="2">CLEAR INFORMATION. SAFER HANDOFFS.</text>
      <text x="0" y="34" fill="#c9d7c3" font-family="Segoe UI, Arial, sans-serif" font-size="16" letter-spacing=".7">Open source software for wildlife reporting, coordination, and handoffs.</text>
    </g>
  </g>
</svg>
