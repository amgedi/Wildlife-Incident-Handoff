<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="320" viewBox="0 0 1400 320" role="img" aria-labelledby="title desc">
  <title id="title">From wildlife incident to safer handoff</title>
  <desc id="desc">Animated forest banner showing a wildlife incident record moving from finder to responder, handoff, and rehabilitation or veterinary follow-up.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1711"/>
      <stop offset="45%" stop-color="#173326"/>
      <stop offset="72%" stop-color="#42503b"/>
      <stop offset="100%" stop-color="#7b624e"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16281e" stop-opacity=".1"/>
      <stop offset="100%" stop-color="#07110c" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8eaa7b"/>
      <stop offset="52%" stop-color="#d9e2d0"/>
      <stop offset="100%" stop-color="#c09b72"/>
    </linearGradient>
    <radialGradient id="pinGlow">
      <stop offset="0%" stop-color="#9ebd88" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#9ebd88" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".22"/>
    </filter>
    <clipPath id="clip">
      <rect width="1400" height="320" rx="30"/>
    </clipPath>
    <path id="caseRoute" d="M160 218 C255 194 325 234 416 211 S575 190 670 213 S829 235 924 208 S1082 190 1238 213"/>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1400" height="320" fill="url(#bg)"/>

    <!-- distant mountains -->
    <path d="M0 153 L142 64 L248 126 L360 44 L480 132 L617 70 L740 138 L879 55 L1002 133 L1140 83 L1270 139 L1400 72 L1400 235 L0 235 Z" fill="#b9c9ad" opacity=".075"/>
    <path d="M0 189 L124 119 L219 165 L326 92 L442 171 L552 116 L682 170 L803 107 L921 173 L1036 113 L1164 168 L1283 111 L1400 175 L1400 244 L0 244 Z" fill="#07110c" opacity=".23"/>

    <!-- forest line -->
    <g fill="#08130d" opacity=".55">
      <path d="M33 239 l18 -46 18 46 h-10 l15 38 h-46 l15-38z"/>
      <path d="M92 245 l15 -39 15 39 h-8 l12 31 h-38 l12-31z"/>
      <path d="M1280 242 l18 -47 18 47 h-10 l15 37 h-46 l15-37z"/>
      <path d="M1330 247 l14 -36 14 36 h-7 l11 29 h-36 l11-29z"/>
      <path d="M1215 249 l13 -33 13 33 h-7 l10 26 h-32 l10-26z"/>
    </g>

    <rect y="213" width="1400" height="107" fill="url(#ground)"/>

    <!-- subtle topographic contours -->
    <g fill="none" stroke="#dce7d5" stroke-width="1" opacity=".08">
      <path d="M-80 87 C140 13 328 105 527 55 C731 4 937 89 1135 44 C1256 16 1366 25 1480 9"/>
      <path d="M-55 111 C150 48 333 130 535 83 C743 35 944 115 1152 69 C1278 41 1389 49 1490 33"/>
      <path d="M-42 135 C164 79 346 153 548 110 C756 66 958 139 1170 99 C1293 76 1397 82 1488 69"/>
    </g>

    <!-- header copy -->
    <text x="70" y="58" fill="#f4f1e8" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="750" letter-spacing="1.4">FROM WILDLIFE INCIDENT TO SAFER HANDOFF</text>
    <text x="72" y="88" fill="#cddbc6" font-family="Segoe UI, Arial, sans-serif" font-size="15" letter-spacing=".55">Observation, location, custody and context stay together as responsibility moves from person to person.</text>

    <!-- route -->
    <use href="#caseRoute" fill="none" stroke="#dce7d5" stroke-opacity=".16" stroke-width="8" stroke-linecap="round"/>
    <use href="#caseRoute" fill="none" stroke="url(#route)" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="14 12">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="3.4s" repeatCount="indefinite"/>
    </use>

    <!-- stage cards -->
    <g font-family="Segoe UI, Arial, sans-serif" filter="url(#shadow)">
      <!-- finder -->
      <g transform="translate(72 126)">
        <rect width="175" height="106" rx="18" fill="#0c1912" fill-opacity=".86" stroke="#9ebd88" stroke-opacity=".32"/>
        <circle cx="31" cy="30" r="20" fill="#213d2d"/>
        <circle cx="31" cy="30" r="29" fill="url(#pinGlow)" opacity=".7">
          <animate attributeName="r" values="22;32;22" dur="2.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".15;.6;.15" dur="2.8s" repeatCount="indefinite"/>
        </circle>
        <path d="M31 17 C23 17 18 23 18 30 C18 40 31 49 31 49 C31 49 44 40 44 30 C44 23 39 17 31 17 Z" fill="none" stroke="#cce0c1" stroke-width="2"/>
        <circle cx="31" cy="30" r="4" fill="#cce0c1"/>
        <text x="59" y="28" fill="#f2f1e9" font-size="13" font-weight="700" letter-spacing=".8">FINDER</text>
        <text x="59" y="45" fill="#aebfa7" font-size="10">wildlife incident</text>
        <text x="18" y="76" fill="#d6dfd1" font-size="11">What happened?</text>
        <text x="18" y="92" fill="#9fb09a" font-size="10">Where? When? What is known?</text>
      </g>

      <!-- record -->
      <g transform="translate(326 120)">
        <rect width="175" height="112" rx="18" fill="#0c1912" fill-opacity=".86" stroke="#9ebd88" stroke-opacity=".26"/>
        <circle cx="31" cy="31" r="20" fill="#213d2d"/>
        <rect x="22" y="19" width="18" height="24" rx="3" fill="none" stroke="#d8e4d2" stroke-width="2"/>
        <path d="M26 25 h10 M26 30 h10 M26 35 h7" stroke="#d8e4d2" stroke-width="1.7" stroke-linecap="round"/>
        <text x="59" y="29" fill="#f2f1e9" font-size="13" font-weight="700" letter-spacing=".8">RECORD</text>
        <text x="59" y="46" fill="#aebfa7" font-size="10">observations + timeline</text>
        <text x="18" y="78" fill="#d6dfd1" font-size="11">Keep uncertainty visible</text>
        <text x="18" y="95" fill="#9fb09a" font-size="10">photos, notes, location, changes</text>
      </g>

      <!-- responder -->
      <g transform="translate(580 126)">
        <rect width="175" height="106" rx="18" fill="#0c1912" fill-opacity=".86" stroke="#dce7d5" stroke-opacity=".23"/>
        <circle cx="31" cy="30" r="20" fill="#263a2c"/>
        <rect x="22" y="22" width="17" height="23" rx="3" fill="none" stroke="#dfe8da" stroke-width="2"/>
        <path d="M26 19 l8-6 M26 28 h9 M27 36 h7" stroke="#dfe8da" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M43 22 q7 8 0 16 M47 19 q11 11 0 22" fill="none" stroke="#b9c8b2" stroke-width="1.4" stroke-linecap="round" opacity=".9">
          <animate attributeName="opacity" values=".25;1;.25" dur="2.2s" repeatCount="indefinite"/>
        </path>
        <text x="59" y="28" fill="#f2f1e9" font-size="13" font-weight="700" letter-spacing=".8">RESPONDER</text>
        <text x="59" y="45" fill="#b7c5b1" font-size="10">coordinate next step</text>
        <text x="18" y="76" fill="#d6dfd1" font-size="11">See the same case context</text>
        <text x="18" y="92" fill="#9fb09a" font-size="10">status, assignment, next action</text>
      </g>

      <!-- handoff -->
      <g transform="translate(834 120)">
        <rect width="175" height="112" rx="18" fill="#0c1912" fill-opacity=".86" stroke="#c7b08e" stroke-opacity=".28"/>
        <circle cx="31" cy="31" r="20" fill="#443b2f"/>
        <path d="M18 28 h17 l-5-5 M35 28 l-5 5 M44 36 H27 l5-5 M27 36 l5 5" fill="none" stroke="#eadcc9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="59" y="29" fill="#f2f1e9" font-size="13" font-weight="700" letter-spacing=".8">HANDOFF</text>
        <text x="59" y="46" fill="#c5b8a5" font-size="10">custody + context</text>
        <text x="18" y="78" fill="#e2d8ca" font-size="11">Responsibility changes</text>
        <text x="18" y="95" fill="#b7aa98" font-size="10">the record moves with the animal</text>
      </g>

      <!-- follow-up -->
      <g transform="translate(1088 126)">
        <rect width="225" height="106" rx="18" fill="#0c1912" fill-opacity=".86" stroke="#c7b08e" stroke-opacity=".34"/>
        <circle cx="31" cy="30" r="20" fill="#443b2f"/>
        <path d="M20 28 L31 19 L42 28 V43 H20 Z" fill="none" stroke="#eadcc9" stroke-width="2" stroke-linejoin="round"/>
        <path d="M31 28 v10 M26 33 h10" stroke="#eadcc9" stroke-width="2" stroke-linecap="round"/>
        <text x="59" y="28" fill="#f2f1e9" font-size="13" font-weight="700" letter-spacing=".8">REHAB / VET</text>
        <text x="59" y="45" fill="#c5b8a5" font-size="10">follow-up + outcome</text>
        <text x="18" y="76" fill="#e2d8ca" font-size="11">History stays intact</text>
        <text x="18" y="92" fill="#b7aa98" font-size="10">new observations continue the timeline</text>
      </g>
    </g>

    <!-- moving case record, not a generic dot -->
    <g filter="url(#softGlow)">
      <g>
        <rect x="-12" y="-15" width="24" height="30" rx="5" fill="#f3f1e8" stroke="#6d8562" stroke-width="1.5"/>
        <path d="M-6 -7 h12 M-6 -1 h12 M-6 5 h8" stroke="#54704f" stroke-width="2" stroke-linecap="round"/>
        <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
          <mpath href="#caseRoute"/>
        </animateMotion>
      </g>
    </g>

    <text x="700" y="286" text-anchor="middle" fill="#b8c5b2" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="1.3">THE ANIMAL MOVES • THE CONTEXT SHOULD NOT GET LOST</text>
  </g>
</svg>
