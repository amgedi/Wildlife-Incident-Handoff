<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Wildlife Incident Handoff</title>
  <desc id="desc">Animated dark forest banner showing information moving from an incident through a handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1510"/>
      <stop offset="42%" stop-color="#183126"/>
      <stop offset="72%" stop-color="#4a4b34"/>
      <stop offset="100%" stop-color="#876b52"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fa56f" stop-opacity="0"/>
      <stop offset="25%" stop-color="#93ac80" stop-opacity=".95"/>
      <stop offset="55%" stop-color="#dce8d3" stop-opacity=".92"/>
      <stop offset="82%" stop-color="#a18463" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#a18463" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="greenGlow">
      <stop offset="0%" stop-color="#83a873" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#83a873" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmGlow">
      <stop offset="0%" stop-color="#b68f66" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#b68f66" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="packetGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip">
      <rect width="1400" height="360" rx="34"/>
    </clipPath>
    <path id="handoffPath" d="M32 112 C84 56 136 137 191 86 C240 41 292 125 364 63"/>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1400" height="360" fill="url(#bg)"/>

    <ellipse cx="155" cy="330" rx="360" ry="230" fill="url(#greenGlow)" filter="url(#blur)">
      <animate attributeName="cx" values="110;270;110" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="325;275;325" dur="11s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1260" cy="40" rx="330" ry="210" fill="url(#warmGlow)" filter="url(#blur)">
      <animate attributeName="cx" values="1290;1130;1290" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="15;82;15" dur="12s" repeatCount="indefinite"/>
    </ellipse>

    <g opacity=".22" fill="none">
      <path d="M-80 282 C180 210 350 310 610 245 C870 181 1085 281 1490 170" stroke="#d8e2d0" stroke-width="1.4">
        <animateTransform attributeName="transform" type="translate" values="-18 0;34 -6;-18 0" dur="15s" repeatCount="indefinite"/>
      </path>
      <path d="M-100 315 C205 250 420 335 690 286 C955 238 1175 305 1500 235" stroke="#a18463" stroke-width="1.5">
        <animateTransform attributeName="transform" type="translate" values="24 0;-32 7;24 0" dur="18s" repeatCount="indefinite"/>
      </path>
      <path d="M-70 335 C240 295 500 345 790 321 C1075 298 1240 332 1470 306" stroke="#93ac80" stroke-width="1.1">
        <animateTransform attributeName="transform" type="translate" values="-15 0;22 -3;-15 0" dur="21s" repeatCount="indefinite"/>
      </path>
    </g>

    <rect x="32" y="30" width="1336" height="300" rx="28" fill="#ffffff" fill-opacity=".035" stroke="#e8e3d8" stroke-opacity=".13"/>
    <rect x="60" y="52" width="1280" height="1" fill="url(#glassLine)" opacity=".45">
      <animate attributeName="opacity" values=".18;.5;.18" dur="6s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(92 90)">
      <text x="0" y="0" fill="#f4f1e8" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="750" letter-spacing="2.6">WILDLIFE INCIDENT HANDOFF</text>
      <text x="2" y="52" fill="#dce8d3" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">Clear information. Safer handoffs.</text>
      <text x="2" y="96" fill="#c6d4bf" font-family="Segoe UI, Arial, sans-serif" font-size="17" letter-spacing="1.7">RECORD  •  COORDINATE  •  HAND OFF  •  PRESERVE CONTEXT</text>
      <g transform="translate(2 128)">
        <rect width="318" height="34" rx="17" fill="#0b1510" fill-opacity=".28" stroke="#d8e2d0" stroke-opacity=".12"/>
        <circle cx="20" cy="17" r="5" fill="#93ac80">
          <animate attributeName="opacity" values=".45;1;.45" dur="2.8s" repeatCount="indefinite"/>
        </circle>
        <text x="35" y="22" fill="#d8e2d0" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing=".8">OBSERVATIONS IN • CONTEXT OUT</text>
      </g>
    </g>

    <g transform="translate(870 88)">
      <rect width="405" height="172" rx="25" fill="#07100b" fill-opacity=".34" stroke="#d8e2d0" stroke-opacity=".13"/>
      <text x="26" y="32" fill="#c8d3bd" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6">INCIDENT TO HANDOFF</text>

      <use href="#handoffPath" fill="none" stroke="#d8e2d0" stroke-opacity=".18" stroke-width="2.2"/>
      <use href="#handoffPath" fill="none" stroke="url(#route)" stroke-width="3" stroke-linecap="round" stroke-dasharray="55 95">
        <animate attributeName="stroke-dashoffset" values="0;-300" dur="5.4s" repeatCount="indefinite"/>
      </use>

      <circle r="5.5" fill="#f4f1e8" filter="url(#packetGlow)">
        <animateMotion dur="4.6s" repeatCount="indefinite" rotate="auto">
          <mpath href="#handoffPath"/>
        </animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="4.6s" repeatCount="indefinite"/>
      </circle>

      <g filter="url(#softGlow)">
        <circle cx="32" cy="112" r="6" fill="#93ac80">
          <animate attributeName="r" values="5;8;5" dur="3.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="191" cy="86" r="6" fill="#d8e2d0">
          <animate attributeName="opacity" values=".55;1;.55" dur="2.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="364" cy="63" r="6" fill="#a18463">
          <animate attributeName="r" values="5;8.5;5" dur="3.6s" repeatCount="indefinite"/>
        </circle>
      </g>

      <text x="27" y="145" fill="#9fb696" font-family="Segoe UI, Arial, sans-serif" font-size="11">OBSERVE</text>
      <text x="166" y="145" fill="#d5dfcf" font-family="Segoe UI, Arial, sans-serif" font-size="11">RECORD</text>
      <text x="325" y="145" fill="#c4a985" font-family="Segoe UI, Arial, sans-serif" font-size="11">HAND OFF</text>
    </g>

    <rect x="-430" y="-120" width="260" height="520" fill="url(#route)" opacity=".08" transform="rotate(17 0 0)">
      <animate attributeName="x" values="-430;1580" dur="10.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
