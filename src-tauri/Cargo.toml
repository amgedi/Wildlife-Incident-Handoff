[package]
name = "wildlife-incident-handoff"
version = "0.2.0"
description = "An open-source, local-first tool for creating clear and traceable wildlife incident handoffs."
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
