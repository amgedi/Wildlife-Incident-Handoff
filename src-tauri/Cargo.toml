[package]
name = "wildlife-incident-handoff"
version = "0.2.0-dev.6"
description = "An open-source, local-first tool for creating clear and traceable wildlife incident handoffs."
license = "AGPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
